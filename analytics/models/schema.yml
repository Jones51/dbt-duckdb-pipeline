models:
  - name: job_postings
    description: "Cleaned postings"
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: "Unique identifier for the job posting."
      - name: job_title
        description: "Title of the job posting."
        data_tests:
          - not_null
      - name: company_name
        description: "Company offering the job."
      - name: job_location
        description: "Location of the job."
      - name: job_schedule_type
        description: "Type of job schedule (e.g., full-time, part-time)."
      - name: job_work_from_home
        description: "Indicates if the job is work from home."
      - name: search_date
        description: "Date when the job was searched."
      - name: search_term
        description: "Search term used to find the job posting."

  - name: jobs_per_month
    description: "Number of job postings per month."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: "month of the job postings."
      - name: role
        description: "Role of the job postings."
      - name: postings
        description: "Count of job postings for the given month."

  - name: top_locations
    description: "Number of job postings per location."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_location
        description: "Location of the job postings."
      - name: postings
        description: "Count of job postings for the given location."

  - name: monthly_summary
    description: "Monthly totals of job postings and share of remote (work from home) postings."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: "Month of the job postings (truncated to the first day of the month)."
        data_tests:
          - not_null
          - unique
      - name: total_postings
        description: "Total count of job postings for the given month, across all roles."
      - name: remote_postings
        description: "Count of work-from-home job postings for the given month."
      - name: pct_remote
        description: "Percentage of postings in the month that are work from home (rounded to 1 decimal)."