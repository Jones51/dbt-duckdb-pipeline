models:
  - name: fct_postings_by_month_role
    description: "Number of job postings per month and role. Grain: one row per (month, role)."
    config:
      persist_docs:
        relation: true
        columns: true
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, role]
    columns:
      - name: month
        description: "Month of the job postings (truncated to the first day of the month)."
        data_tests:
          - not_null
      - name: role
        description: "Role (search term) of the job postings."
        data_tests:
          - not_null
      - name: postings
        description: "Count of job postings for the given month and role."
        data_tests:
          - not_null

  - name: fct_top_locations
    description: "Top 10 locations by number of job postings. Grain: one row per location."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_location
        description: "Location of the job postings."
        data_tests:
          - not_null
          - unique
      - name: postings
        description: "Count of job postings for the given location."
        data_tests:
          - not_null

  - name: fct_monthly_summary
    description: "Monthly totals of job postings and share of remote (work from home) postings. Grain: one row per month."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: "Month of the job postings (truncated to the first day of the month)."
        data_tests:
          - not_null
          - unique
      - name: total_postings
        description: "Total count of job postings for the given month, across all roles."
        data_tests:
          - not_null
      - name: remote_postings
        description: "Count of work-from-home job postings for the given month."
      - name: pct_remote
        description: "Percentage of postings in the month that are work from home (rounded to 1 decimal)."
